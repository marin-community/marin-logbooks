<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">Three text sets have different jobs</title><desc id="desc">Update text constructs candidate directions. Calibration text selects actions. Choices are locked before evaluation text measures the outcome.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#1f77b4"/></marker></defs>
<rect width="760" height="540" fill="white"/>
<g font-family="Verdana,Arial,sans-serif" fill="#17212b" text-anchor="middle">
<rect x="50" y="20" width="660" height="104" rx="8" fill="#edf4f9" stroke="#1f77b4" stroke-width="2"/>
<text x="380" y="59" font-size="24" font-weight="bold">1. Update text</text><text x="380" y="96" font-size="21">Construct candidate directions</text>
<path d="M380,130 V165" stroke="#1f77b4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="176" width="660" height="104" rx="8" fill="#edf4f9" stroke="#1f77b4" stroke-width="2"/>
<text x="380" y="215" font-size="24" font-weight="bold">2. Calibration text</text><text x="380" y="252" font-size="21">Choose the action and its step length</text>
<path d="M380,286 V313" stroke="#1f77b4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="150" y="325" width="460" height="48" rx="6" fill="#fff2e5" stroke="#b85b00" stroke-width="2"/>
<text x="380" y="357" font-size="22" font-weight="bold">Save and lock all choices</text>
<path d="M380,379 V406" stroke="#1f77b4" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="418" width="660" height="104" rx="8" fill="#edf4f9" stroke="#1f77b4" stroke-width="2"/>
<text x="380" y="457" font-size="24" font-weight="bold">3. Evaluation text</text><text x="380" y="494" font-size="21">Measure the already chosen action</text>
</g></svg>
